name: pcpartcheck

services:
  reference-api:
    build:
      context: .
      dockerfile: apps/reference-api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    init: true

  demo-web:
    build:
      context: .
      dockerfile: apps/demo-web/Dockerfile
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PCPARTCHECK_API_URL: http://reference-api:3001/v1/demo
      PCPARTCHECK_PUBLIC_API_URL: http://127.0.0.1:3001/docs/
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      reference-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    init: true
